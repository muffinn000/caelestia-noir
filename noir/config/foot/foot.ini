# NOIR / quiet, high-contrast terminal
shell=fish
title=foot
font=JetBrainsMono Nerd Font:size=11.5
letter-spacing=0
dpi-aware=no
pad=24x20
bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.97
alpha-mode=matching
blur=yes
background=0e0e0e
foreground=eeeeee
selection-foreground=111111
selection-background=d4d4d4
regular0=222222
regular1=b5b5b5
regular2=cccccc
regular3=e0e0e0
regular4=aaaaaa
regular5=c0c0c0
regular6=d6d6d6
regular7=e8e8e8
bright0=777777
bright1=cecece
bright2=dedede
bright3=f5f5f5
bright4=c4c4c4
bright5=d8d8d8
bright6=eeeeee
bright7=ffffff

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
